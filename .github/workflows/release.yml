name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode platform keystore
        run: echo "${{ secrets.NOXOS_PLATFORM_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/platform.jks"

      - name: Build release APK
        env:
          NOXOS_KEYSTORE_PATH: ${{ runner.temp }}/platform.jks
          NOXOS_KEYSTORE_PASSWORD: ${{ secrets.NOXOS_PLATFORM_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/*.apk \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

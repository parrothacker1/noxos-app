name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (for triggering from another workflow, since GITHUB_TOKEN-authored pushes do not cascade to push-triggered workflows)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag name
        id: tagname
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode platform keystore
        run: echo "${{ secrets.NOXOS_PLATFORM_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/platform.jks"

      - name: Build release APK
        env:
          NOXOS_KEYSTORE_PATH: ${{ runner.temp }}/platform.jks
          NOXOS_KEYSTORE_PASSWORD: ${{ secrets.NOXOS_PLATFORM_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tagname.outputs.tag }}" \
            app/build/outputs/apk/release/*.apk \
            --title "${{ steps.tagname.outputs.tag }}" \
            --generate-notes
